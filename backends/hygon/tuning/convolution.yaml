# gfx936/wave64 strict-IEEE convolution search spaces. Each direction uses a
# union META schema; compiler_nn projects it to the constants accepted by the
# selected generic or Hygon-specialized stage. Keeping every entry explicit
# makes the compiled candidate set deterministic and auditable.
conv_fprop:
  - META:
      BLOCK_M: 16
      BLOCK_HW: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 32
      BLOCK_CI: 16
      BLOCK_K: 16
      GROUP_M: 4
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_HW: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 8
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 64
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_HW: 256
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 8
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 4
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 4
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 64
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 4
    num_warps: 2
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_HW: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 2
    num_warps: 2
    num_stages: 2
  # Row-bounded low-channel stem tile.  BLOCK_M stays within one output row,
  # removing per-element row/column division in the Hygon direct path.
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_K: 32
      GROUP_M: 1
    num_warps: 4
    num_stages: 1
  # Large-reduction FProp GEMM shapes (for example YOLO P5) benefit from a
  # wider reduction tile on gfx936.  Keep both aspect ratios because output
  # channel count and output area vary independently across the shared NVIDIA
  # benchmark catalog; each private stage projects only the META it consumes.
  - META:
      BLOCK_M: 32
      BLOCK_HW: 32
      BLOCK_OC: 128
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 2
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_HW: 128
      BLOCK_OC: 32
      BLOCK_CI: 64
      BLOCK_K: 64
      GROUP_M: 1
    num_warps: 4
    num_stages: 2

  # Isolated candidates for the exact FP32 N8/Ci32/Co64/32x32 3x3-s1-p1
  # direct kernel. Distinct *_S keys keep them out of generic FProp stages.
  - META:
      BLOCK_OC_S: 64
      BLOCK_K_S: 32
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_OC_S: 64
      BLOCK_K_S: 32
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_OC_S: 64
      BLOCK_K_S: 64
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_OC_S: 32
      BLOCK_K_S: 64
    num_warps: 4
    num_stages: 1

  # Isolated gfx936 candidates for the strict FP32 YOLO-X P5 GEMM entry
  # point. The distinct *_X names and marker keep these rows out of every
  # generic FProp stage while preserving the registry conv_fprop contract.
  - META:
      BLOCK_M_X: 32
      BLOCK_OC_X: 32
      BLOCK_K_X: 32
      GROUP_M_X: 8
      YOLO_X_P5: 1
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M_X: 32
      BLOCK_OC_X: 64
      BLOCK_K_X: 64
      GROUP_M_X: 12
      YOLO_X_P5: 1
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M_X: 32
      BLOCK_OC_X: 64
      BLOCK_K_X: 64
      GROUP_M_X: 16
      YOLO_X_P5: 1
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M_X: 32
      BLOCK_OC_X: 64
      BLOCK_K_X: 64
      GROUP_M_X: 24
      YOLO_X_P5: 1
    num_warps: 4
    num_stages: 2

conv_dgrad:
  - META:
      BLOCK_M: 16
      BLOCK_CI: 16
      BLOCK_CO: 16
      BLOCK_K: 16
      GROUP_M: 4
      BLOCK_SIZE: 128
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_CI: 16
      BLOCK_CO: 32
      BLOCK_K: 16
      GROUP_M: 4
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 32
      BLOCK_CO: 64
      BLOCK_K: 64
      GROUP_M: 8
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 64
      BLOCK_CO: 64
      BLOCK_K: 64
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 8
    num_stages: 2
  # gfx936 stride-2 DGrad winners.  The two 64x64 output tiles cover the
  # standard FP16 and large P5 FP32 aspect ratios; the narrower M tile with a
  # wider packed-CI tile removes excess work for the 512-channel P5 case.
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 4
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 4
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_CI: 128
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_CI: 64
      BLOCK_CO: 64
      BLOCK_K: 64
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 256
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 512
      BLOCK_CI: 32
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 8
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 256
      BLOCK_CI: 64
      BLOCK_CO: 32
      BLOCK_K: 32
      GROUP_M: 4
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 2
  # Exact FP32/BF16 N8/CI32/CO64/HW32 3x3/s1 route.  The marker and partial
  # META schema isolate these no-tail kernels from the generic DGrad search
  # space.  BM64/w4 wins GEMM; BH4/w2 wins col2im.  BM128/BH8 keeps a second
  # legal launch grid for both stages.
  - META:
      BLOCK_M: 64
      GROUP_M: 16
      BLOCK_H: 4
      EXACT_3X3_S1: 1
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 64
      GROUP_M: 16
      BLOCK_H: 4
      EXACT_3X3_S1: 1
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 128
      GROUP_M: 16
      BLOCK_H: 8
      EXACT_3X3_S1: 1
    num_warps: 4
    num_stages: 1

conv_wgrad:
  - META:
      BLOCK_M: 32
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 16
      BLOCK_K: 16
      BLOCK_SIZE: 128
    num_warps: 2
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 32
      BLOCK_K: 16
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 16
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  # Wide output/filter tiles are critical for the 40x40 P5 WGrad GEMMs on
  # gfx936. The same union META remains valid for direct-split and packing
  # stages because compiler_nn projects only the constants each stage uses.
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2

  # Row-major P5 WGrad winners from gfx936 probes.
  - META:
      BLOCK_M: 32
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 16
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 16
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 64
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  - META:
      BLOCK_M: 32
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 1
  # Dedicated row-major pack candidates; GEMM-only keys are projected away.
  - META:
      BLOCK_M: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 16
      BLOCK_OC: 16
      BLOCK_CI: 16
      BLOCK_CI_K: 32
      BLOCK_K: 64
      BLOCK_SIZE: 256
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 64
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
  # Low-CI stem: match CIK=27 without the 2x padding of a 64-wide tile.
  - META:
      BLOCK_M: 64
      BLOCK_OC: 64
      BLOCK_CI: 32
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 32
      BLOCK_K: 32
      BLOCK_SIZE: 512
    num_warps: 4
    num_stages: 1
  # Medium-aspect P5 tile and a square direct-stride tile found by the
  # gfx936 occupancy probes. Keep stage count low on the packed P5 path.
  - META:
      BLOCK_M: 64
      BLOCK_OC: 32
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 64
      BLOCK_OC: 128
      BLOCK_CI: 32
      BLOCK_CI_K: 128
      BLOCK_K: 32
      BLOCK_SIZE: 1024
    num_warps: 8
    num_stages: 2
